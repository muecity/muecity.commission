<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="รายชื่อโปรแกรมที่ Muecity ใช้ในการทำงานเพลง">
  <title>โปรแกรมที่ใช้ในการทำงาน | Muecity</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #282333;
      --muted: #777183;
      --paper: #f8f6fb;
      --surface: #fff;
      --line: #e5deee;
      --primary: #684b8f;
      --primary-dark: #392651;
      --accent: #d6c2ee;
      --soft-primary: #f1ecf7;
      font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); line-height: 1.8; }
    a { color: inherit; }
    .container { width: min(1000px, calc(100% - 36px)); margin-inline: auto; }
    .topbar { position: sticky; top: 0; z-index: 10; color: #fff; background: var(--primary-dark); box-shadow: 0 6px 20px rgb(35 22 51 / 12%); }
    .topbar-inner { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { color: #fff; font-weight: 700; letter-spacing: .08em; text-decoration: none; }
    .back-link { color: rgb(255 255 255 / 84%); font-size: .9rem; text-decoration: none; }
    .back-link:hover { color: #fff; }
    main { min-height: calc(100vh - 130px); padding: 64px 0 80px; }
    .intro { max-width: 700px; margin-bottom: 32px; }
    .section-reveal { opacity: 0; transform: translateY(14px); transition: opacity .42s ease, transform .42s ease; }
    .section-reveal.is-visible { opacity: 1; transform: translateY(0); }
    .eyebrow { margin: 0 0 8px; color: var(--primary); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 10px; color: var(--primary-dark); font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.3; }
    .intro p:last-child { margin: 0; color: var(--muted); }
    .tool-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .tool-card {
      min-width: 0;
      padding: 24px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 14px 36px rgb(57 38 81 / 7%);
      text-align: center;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .tool-card:hover { transform: translateY(-3px); border-color: rgb(104 75 143 / 38%); box-shadow: 0 18px 42px rgb(57 38 81 / 12%); }
    .tool-icon {
      display: grid;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      place-items: center;
      overflow: hidden;
      border-radius: 20px;
      background: var(--soft-primary);
    }
    .tool-icon img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .tool-card h2 { margin: 0; color: var(--primary-dark); font-size: 1rem; line-height: 1.5; }
    footer { padding: 20px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
    @media (max-width: 820px) {
      .tool-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .container { width: min(100% - 26px, 1000px); }
      .topbar-inner { min-height: 58px; }
      .back-link { font-size: .82rem; }
      main { padding-top: 42px; }
      .tool-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .tool-card { padding: 20px 12px; }
      .tool-icon { width: 82px; height: 82px; margin-bottom: 12px; border-radius: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="muecity-theme.css" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="muecity-services.html">MUECITY</a>
      <a class="back-link" href="muecity-services.html">กลับหน้าบริการและอัตราค่าบริการ</a>
    </div>
  </header>
  <main class="container">
    <section class="intro" aria-labelledby="tools-title">
      <p class="eyebrow">Production tools</p>
      <h1 id="tools-title">โปรแกรมที่ใช้ในการทำงาน</h1>
      <p>รายชื่อโปรแกรมที่ใช้ในการผลิตและจัดเตรียมงานเพลงของ Muecity</p>
    </section>
    <div class="tool-grid">
      <article class="tool-card">
        <div class="tool-icon"><img src="music-programs/ableton-live.jpeg" alt="ไอคอน Ableton Live"></div>
        <h2>Ableton Live</h2>
      </article>
      <article class="tool-card">
        <div class="tool-icon"><img src="music-programs/fl-studio.jpeg" alt="ไอคอน FL Studio"></div>
        <h2>FL Studio</h2>
      </article>
      <article class="tool-card">
        <div class="tool-icon"><img src="music-programs/logic-pro.png" alt="ไอคอน Logic Pro"></div>
        <h2>Logic Pro</h2>
      </article>
      <article class="tool-card">
        <div class="tool-icon"><img src="music-programs/uvr5.png" alt="ไอคอน UVR5"></div>
        <h2>UVR5</h2>
      </article>
      <article class="tool-card">
        <div class="tool-icon"><img src="music-programs/izotope-rx12.png" alt="ไอคอน iZotope RX 12"></div>
        <h2>iZotope RX 12</h2>
      </article>
    </div>
  </main>
  <footer><div class="container">Muecity · บริการผลิตเพลง</div></footer>
  <script>
    (() => {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion || !("IntersectionObserver" in window)) return;

      const sections = document.querySelectorAll("main > .intro, main > .tool-grid");
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        });
      }, { rootMargin: "0px 0px -6% 0px", threshold: 0.05 });

      sections.forEach(section => {
        section.classList.add("section-reveal");
        observer.observe(section);
      });
    })();
  </script>
</body>
</html>
